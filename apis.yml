aid: hardware-intelligence
name: Hardware Intelligence
description: >-
  Hardware Intelligence is a Y Combinator (Summer 2026) startup based in San
  Francisco building an end-to-end, agent-native toolchain for chip design.
  Founded in 2026 by Athreya Anand, the company applies agentic AI and ultrafast
  feedback loops to the semiconductor design and verification workflow. Its first
  product, Wave, is a terminal-native waveform debugger with a verification agent
  built in, aimed at accelerating hardware debugging and design iteration. At the
  time of profiling the company is pre-launch with early-access pilots and a
  waitlist; it publishes no public API, developer documentation, SDKs, or
  OpenAPI, so this API Evangelist profile captures company identity only and
  awaits a developer surface to enrich.
